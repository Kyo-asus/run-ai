<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 462" width="810" height="462">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="810" height="462" fill="#FFFFFF" rx="6"/>

  <!-- Title -->
  <text x="405" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">OpenShell on NVIDIA Run:ai</text>

  <!-- ── LEFT: user ── -->
  <rect x="30" y="76" width="190" height="96" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="42" y="68" width="120" height="20" rx="4" fill="#94A3B8"/>
  <text x="102" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">User (team-a)</text>
  <rect x="46" y="98" width="158" height="58" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="46" y="98" width="5" height="58" rx="4" fill="#94A3B8"/>
  <text x="127" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">openshell CLI</text>

  <!-- ── LEFT: identity provider ── -->
  <rect x="30" y="262" width="190" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="42" y="254" width="168" height="20" rx="4" fill="#94A3B8"/>
  <text x="126" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Your identity provider</text>
  <rect x="46" y="284" width="158" height="74" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="46" y="284" width="5" height="74" rx="4" fill="#94A3B8"/>
  <text x="127" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">OIDC</text>
  <text x="127" y="338" text-anchor="middle" font-size="11" fill="#64748B">Users and groups</text>

  <!-- ── CLUSTER ── -->
  <rect x="340" y="62" width="440" height="348" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="352" y="54" width="250" height="20" rx="4" fill="#94A3B8"/>
  <text x="477" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Kubernetes cluster (NVIDIA Run:ai)</text>

  <!-- Namespace: openshell -->
  <rect x="360" y="96" width="400" height="128" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="372" y="88" width="190" height="18" rx="4" fill="#64748B"/>
  <text x="467" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Namespace: openshell</text>

  <!-- Gateway -->
  <rect x="380" y="118" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="380" y="118" width="5" height="88" rx="4" fill="#94A3B8"/>
  <text x="482" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">OpenShell gateway</text>
  <text x="482" y="163" text-anchor="middle" font-size="11" fill="#64748B">(operator mode)</text>
  <text x="482" y="187" text-anchor="middle" font-size="10.5" fill="#64748B">Checks the token's groups claim</text>

  <!-- Workspace -->
  <rect x="612" y="118" width="128" height="88" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="612" y="118" width="5" height="88" rx="4" fill="#94A3B8"/>
  <text x="680" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">Workspace</text>
  <text x="680" y="170" text-anchor="middle" font-size="11" fill="#64748B">runai-team-a</text>

  <!-- Namespace: runai-team-a -->
  <rect x="360" y="266" width="400" height="124" rx="8" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
  <rect x="372" y="258" width="320" height="18" rx="4" fill="#8BB85B"/>
  <text x="532" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="#000000" fill-opacity="0.87">Namespace: runai-team-a (NVIDIA Run:ai project team-a)</text>
  <text x="380" y="296" font-size="11" fill="#64748B">The user's agents</text>

  <rect x="380" y="304" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.5"/>
  <rect x="380" y="304" width="5" height="44" rx="4" fill="#AED581"/>
  <text x="468" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">Agent pod</text>

  <rect x="570" y="304" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.5"/>
  <rect x="570" y="304" width="5" height="44" rx="4" fill="#AED581"/>
  <text x="658" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">Supervisor pod</text>

  <text x="560" y="372" text-anchor="middle" font-size="11" fill="#64748B">All pods are scheduled by runai-scheduler</text>

  <!-- ── ARROWS ── -->
  <!-- workspace -> project namespace -->
  <line x1="680" y1="206" x2="680" y2="266" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- CLI -> gateway: gRPC + OIDC via ingress -->
  <polyline points="204,127 290,127 290,142 380,142" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="247" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">gRPC + OIDC</text>
  <text x="247" y="124" text-anchor="middle" font-size="10.5" fill="#64748B">(via ingress)</text>

  <!-- CLI -> IdP: company sign-in -->
  <line x1="127" y1="172" x2="127" y2="254" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="139" y="206" font-size="11" font-weight="600" fill="#64748B">Company sign-in</text>
  <text x="139" y="220" font-size="10.5" fill="#64748B">(SSO)</text>

  <!-- IdP -> gateway: token -->
  <polyline points="204,321 300,321 300,175 380,175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="252" y="313" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">Token</text>

  <!-- Footer note -->
  <text x="405" y="440" text-anchor="middle" font-size="11" fill="#64748B">A platform administrator creates the workspace and adds each user to it.</text>
</svg>
